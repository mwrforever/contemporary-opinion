name: daily_planner
description: "纯前端 Flutter 每日规划助手：定时提醒 + 语音解析自动规划"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # 状态管理（FEATURES 指定 Provider）
  provider: ^6.1.5+1

  # 本地数据库：SQLite（FEATURES 指定 sqflite，替代 Hive；22.x 需 Android desugaring）
  sqflite: ^2.4.3

  # 本地通知 / 精确调度（系统级精确提醒，应用被杀仍可弹）
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1

  # 响铃（just_audio 播放内置闹钟音 + audio_session 配置 alarm 会话）
  # 生产选型：just_audio（Java 实现，AGP 9/Gradle 9 兼容，活跃维护）替代 FEATURES 草案中的 audioplayers
  just_audio: ^0.10.0
  audio_session: ^0.2.4

  # 语音播报
  flutter_tts: ^4.2.5

  # 录音 PCM 采集
  record: ^7.1.1

  # 头像选择（个人页）
  image_picker: ^1.2.3

  # 权限（13.x 为最新主版本，注意与 12.x 的破坏性 API 变更）
  permission_handler: ^13.0.0

  # 路径与备份文件（导出 share_plus / 导入 file_selector）
  path_provider: ^2.1.6
  # 暂锁 12.x 稳定线（file_picker 已移除，构建稳定后可评估升 13.x）
  share_plus: ^12.0.0
  # 官方文件选择（Java 实现）；替代 file_picker：其 Android 端 Kotlin 1.8.22 与 AGP 9/Gradle 9 不兼容
  file_selector: ^1.1.0

  # 阿里云接入：HTTP 调用 qwen3.7-plus（排期）+ qwen3-asr-flash（语音识别）
  # 两者同为百炼/DashScope 模型，共用一个 DASHSCOPE_API_KEY
  http: ^1.6.0

  # 密码哈希 PBKDF2-HMAC-SHA256（自实现，基于官方 crypto）
  crypto: ^3.0.7

  # 旧版数据迁移运行时依赖（任务/记事本）；待所有用户完成迁移后移除
  hive_ce: ^2.19.0
  hive_ce_flutter: ^2.3.0

  # 工具
  intl: ^0.20.3
  uuid: ^4.6.0
  yaml: ^3.1.3
  # 暂锁 9.x 稳定线（file_picker 已移除，构建稳定后可评估升 10.x）
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # 纯 Dart / CI 环境运行 sqflite 测试
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/prompts/
    - assets/audio/
