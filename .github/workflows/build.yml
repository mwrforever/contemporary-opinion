# 自动构建 Android APK
# 触发：推送到 main 分支，或手动在 Actions 页面点击 Run workflow
# 产物：build/app/outputs/flutter-apk/app-release.apk（可在 Actions 页下载）
#
# 说明：
# - 使用 ubuntu runner，无 Windows 的 WDAC 限制，Flutter 的 AOT 编译器 gen_snapshot 可正常执行。
# - 语音功能密钥（DashScope）为可选：在仓库 Settings → Secrets 配置 DASHSCOPE_API_KEY / DASHSCOPE_BASE_URL 后，
#   会自动写入 lib/config/secrets.dart；未配置则保留占位符，APK 照常构建，仅语音功能无密钥不可用。

name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: "stable"
          cache: true

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components (platform-34 + build-tools 34.0.0)
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Configure secrets (optional)
        env:
          DKEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DURL: ${{ secrets.DASHSCOPE_BASE_URL }}
        run: |
          cp lib/config/secrets.dart.example lib/config/secrets.dart
          if [ -n "$DKEY" ]; then
            sed -i "s|kDashscopeApiKey = '[^']*'|kDashscopeApiKey = '$DKEY'|" lib/config/secrets.dart
            echo "DASHSCOPE_API_KEY injected."
          fi
          if [ -n "$DURL" ]; then
            sed -i "s|kDashscopeBaseUrl = '[^']*'|kDashscopeBaseUrl = '$DURL'|" lib/config/secrets.dart
            echo "DASHSCOPE_BASE_URL injected."
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
