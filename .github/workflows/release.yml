name: Release

# 打 tag（v*）时构建正式产物并创建 GitHub Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.6"
  FLUTTER_CHANNEL: stable
  BASE_HREF: /contemporary-opinion/

jobs:
  build:
    name: Build Web + Android (signed if configured)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Prepare local secrets file (secrets.dart 不入库，从示例模板生成)
        run: cp lib/config/secrets.dart.example lib/config/secrets.dart
      - name: Accept Android licenses (best-effort)
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - name: Install Android SDK 37 (compileSdk 要求，运行器预装版本常滞后)
        run: |
          sdkmanager "platforms;android-37" "build-tools;37.0.0" >/dev/null 2>&1 || true
      - name: Decode keystore & write key.properties (若配置了 KEYSTORE_BASE64)
        # if: 条件中禁止使用 secrets 上下文，故通过 env 注入并在 shell 内判断
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            cat > android/key.properties <<'EOF'
            storeFile=upload-keystore.jks
            storePassword=$KEYSTORE_PASSWORD
            keyAlias=$KEY_ALIAS
            keyPassword=$KEY_PASSWORD
            EOF
            echo "正式签名已配置（key.properties 已生成）"
          else
            echo "未配置 KEYSTORE_BASE64，构建将回退 debug 签名"
          fi
      - name: Build web release
        run: |
          flutter build web --release \
            --base-href "$BASE_HREF" \
            --dart-define=DASHSCOPE_API_KEY="${{ secrets.DASHSCOPE_API_KEY }}" \
            --dart-define=DASHSCOPE_BASE_URL="${{ secrets.DASHSCOPE_BASE_URL }}"
      - name: Build Android APK (with AGP fallback)
        shell: bash
        run: |
          set +e
          flutter build apk --release \
            --dart-define=DASHSCOPE_API_KEY="${{ secrets.DASHSCOPE_API_KEY }}" \
            --dart-define=DASHSCOPE_BASE_URL="${{ secrets.DASHSCOPE_BASE_URL }}"
          if [ $? -ne 0 ]; then
            echo "::warning::首次构建失败，回退 AGP/Kotlin/Gradle 后重试..."
            sed -i 's/com.android.application" version "9.0.1"/com.android.application" version "8.11.1"/' android/settings.gradle.kts
            sed -i 's/org.jetbrains.kotlin.android" version "2.3.20"/org.jetbrains.kotlin.android" version "2.2.20"/' android/settings.gradle.kts
            sed -i 's#gradle-9.1.0-all.zip#gradle-8.11.1-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
            flutter build apk --release \
              --dart-define=DASHSCOPE_API_KEY="${{ secrets.DASHSCOPE_API_KEY }}" \
              --dart-define=DASHSCOPE_BASE_URL="${{ secrets.DASHSCOPE_BASE_URL }}"
          fi
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            build/web
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts
      - name: Prepare assets
        run: |
          cd release-artifacts
          mv build/app/outputs/flutter-apk/app-release.apk app-release.apk
          zip -r web-build.zip build/web
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/app-release.apk
            release-artifacts/web-build.zip
          generate_release_notes: true

  # 可选：iOS 构建。需要 Apple 开发者证书/描述文件才能产出可分发 IPA。
  # 默认关闭；在仓库 Settings -> Variables 添加 IOS_BUILD_ENABLED=true 后启用。
  ios:
    name: Build iOS (optional, needs Apple certs)
    if: ${{ vars.IOS_BUILD_ENABLED == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS (no-codesign)
        # 无证书时仅产出 Runner.app（不可上架），仅供本地/模拟器验证
        run: flutter build ios --release --no-codesign
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos
