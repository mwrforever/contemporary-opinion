name: CI

# 自动构建 + 测试：每次 push 到 main、以及向 main 提 PR 时触发
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.6"
  FLUTTER_CHANNEL: stable
  # GitHub Pages 项目站点基址（仓库名 contemporary-opinion）。
  # 若改用自定义域名或 user/org 页，请改为 "/"。
  BASE_HREF: /contemporary-opinion/

jobs:
  analyze_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Prepare local secrets file (secrets.dart 不入库，从示例模板生成)
        run: cp lib/config/secrets.dart.example lib/config/secrets.dart
      - name: Static analysis (0 error 为通过；存量 info/warning 不阻断)
        run: flutter analyze
      - name: Run tests
        run: flutter test

  build_web:
    name: Build Web
    needs: analyze_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Prepare local secrets file (secrets.dart 不入库，从示例模板生成)
        run: cp lib/config/secrets.dart.example lib/config/secrets.dart
      - name: Build web release
        # DASHSCOPE_* 通过 --dart-define 注入；仓库未设 Secrets 时为空串 -> 自动走本地兜底
        run: |
          flutter build web --release \
            --base-href "$BASE_HREF" \
            --dart-define=DASHSCOPE_API_KEY="${{ secrets.DASHSCOPE_API_KEY }}" \
            --dart-define=DASHSCOPE_BASE_URL="${{ secrets.DASHSCOPE_BASE_URL }}"
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          if-no-files-found: error
          retention-days: 14

  build_android:
    name: Build Android APK
    needs: analyze_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Prepare local secrets file (secrets.dart 不入库，从示例模板生成)
        run: cp lib/config/secrets.dart.example lib/config/secrets.dart
      - name: Accept Android licenses (best-effort)
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - name: Install Android SDK 37 (compileSdk 要求，运行器预装版本常滞后)
        run: |
          sdkmanager "platforms;android-37" "build-tools;37.0.0" >/dev/null 2>&1 || true
      - name: Build Android APK (with AGP fallback)
        shell: bash
        run: |
          set +e
          flutter build apk --release \
            --dart-define=DASHSCOPE_API_KEY="${{ secrets.DASHSCOPE_API_KEY }}" \
            --dart-define=DASHSCOPE_BASE_URL="${{ secrets.DASHSCOPE_BASE_URL }}"
          if [ $? -ne 0 ]; then
            echo "::warning::首次构建失败，疑似 AGP 9.0.1/Kotlin 2.3.20 与 Flutter 验证基准不符，回退到 AGP 8.11.1/Kotlin 2.2.20/Gradle 8.11.1 后重试..."
            sed -i 's/com.android.application" version "9.0.1"/com.android.application" version "8.11.1"/' android/settings.gradle.kts
            sed -i 's/org.jetbrains.kotlin.android" version "2.3.20"/org.jetbrains.kotlin.android" version "2.2.20"/' android/settings.gradle.kts
            sed -i 's#gradle-9.1.0-all.zip#gradle-8.11.1-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
            flutter build apk --release \
              --dart-define=DASHSCOPE_API_KEY="${{ secrets.DASHSCOPE_API_KEY }}" \
              --dart-define=DASHSCOPE_BASE_URL="${{ secrets.DASHSCOPE_BASE_URL }}"
          fi
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
