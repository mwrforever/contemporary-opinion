name: CI

# 自动构建 + 测试：每次 push 到 main、以及向 main 提 PR 时触发
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.6"
  FLUTTER_CHANNEL: stable

jobs:
  analyze_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Prepare local secrets file (secrets.dart 不入库，从示例模板生成)
        run: cp lib/config/secrets.dart.example lib/config/secrets.dart
      - name: Static analysis (0 error 为通过；存量 info/warning 不阻断)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        run: flutter test

  build_android:
    name: Build Android APK
    needs: analyze_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Prepare local secrets file (secrets.dart 不入库，从示例模板生成)
        run: cp lib/config/secrets.dart.example lib/config/secrets.dart
      - name: Accept Android licenses (best-effort)
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - name: Install Android SDK 37 (compileSdk 要求，运行器预装版本常滞后)
        run: |
          sdkmanager "platforms;android-37" "build-tools;37.0.0" >/dev/null 2>&1 || true
      - name: Generate debug keystore
        # release 签名未配置 key.properties 时回退 debug 签名；
        # CI 运行器默认没有 debug.keystore，需先预生成
        run: |
          mkdir -p ~/.config/.android
          keytool -genkeypair -v -keystore ~/.config/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
      - name: Build Android APK
        shell: bash
        run: |
          flutter build apk --release \
            --dart-define=DASHSCOPE_API_KEY="${{ secrets.DASHSCOPE_API_KEY }}" \
            --dart-define=DASHSCOPE_BASE_URL="${{ secrets.DASHSCOPE_BASE_URL }}"
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
